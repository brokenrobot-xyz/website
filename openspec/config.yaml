schema: frontend-change

# Project context — shown to the AI when creating any artifact (proposal, specs, design, tasks).
# These are the site's enduring constraints; honor them in every change. See docs/ for detail.
# All project-specific prose lives in this file (context, rules, operations). The frontend-change
# schema fork stays upstream-verbatim except its name/description and two template seeds (the
# proposal Non-Goals heading, the tasks Verify group) — see docs/tooling/workflow.md.
context: |
  brokenrobot.xyz is a static, ad-free, CSP-strict personal site: Astro with Preact islands,
  self-hosted fonts, and first-class light/dark theming. Honor these enduring constraints in
  every change:

  - Static output only — no SSR, no runtime backend.
  - Strict CSP — no inline `on*` handlers; client JS loads from `self`. The one permitted
    third-party script is the Cloudflare Web Analytics beacon (allowed in astro.config.ts,
    injected at the edge, never present in dist/); add no others. Inline <script> is limited to
    BaseLayout's pre-paint theme-init, whose CSP hash BaseLayout registers, and
    application/ld+json structured-data blocks.
  - Both themes are first-class — components read design tokens (CSS custom properties on
    <html>), never hard-coded colors. Automated coverage is light-only today: the Playwright
    projects are Desktop Chrome and Pixel 7, both light, so a dark-theme regression rests on
    human review until dark projects are wired.
  - Interactivity ladder — stateful UI → Preact island (client:*); small DOM wiring → a bundled
    Astro <script> importing a .ts module; pre-paint only → BaseLayout's theme-init.
  - Stable contracts — the /blog/<slug>/ permalinks and rss.xml must keep working.

  Authoritative docs: docs/architecture.md, docs/development/conventions/coding-conventions.md,
  docs/development-workflow.md, plus docs/vision.md, docs/brand.md, docs/tech-stack.md.

  Out of scope for OpenSpec: authoring or editing blog article prose under src/content/blog/**
  (written directly, not specced). Blog *infrastructure* — components, the content schema, remark
  plugins, the RSS feed — IS in scope.

# Per-artifact rules — appended to the composed instructions of that artifact only. Any bullet
# containing an inner "key: value" must be quoted, or YAML parses it as a map and the whole list
# is dropped with a warning on stderr.
rules:
  proposal:
    - Fill the template's "## Non-Goals" section — what this change explicitly does NOT do, to keep scope tight.
    - Authoring or editing blog article prose is not a valid change — say so and stop if that is the real request.
    - "If the change's REMOVED entries take a capability's last requirement, set `retire_capabilities: true` in the change's `.openspec.yaml` and call it out in **What Changes** — archive then deletes that capability's main spec, recoverable only from git."
    - When another change under `openspec/changes/` must merge before this change, name that change by its exact directory name in **Impact** and state what it blocks — a slice that assumes work an unmerged change has not delivered yet fails at implementation.
  specs:
    - The observable behavior that matters here is what visitors and downstream consumers (feeds, crawlers) rely on; the external constraints that matter are accessibility, CSP, performance, and compatibility.
    - Keep implementation choices out of specs — Astro page vs. Preact island, client directives, component or function names.
  design:
    - "Create design.md when any of these apply — this repo's reading of the generic inclusion criteria: a new interactive component, a new dependency, a change to the CSP surface (inline scripts, script sources, edge headers), a change to token or theming structure, or a migration touching a stable contract (the /blog/<slug>/ permalinks, rss.xml)."
    - "A change that adds or alters interactive UI records the interactivity-tier choice as a Decision with rationale and the alternatives ruled out — Preact island (client:*) vs. bundled Astro <script> importing a .ts module vs. BaseLayout's pre-paint init. State why the choice is correct on the first frame: the theme toggle shipped as an island and was reworked as a script to remove a post-hydration icon flash."
    - Decisions that touch color, spacing, or elevation name design tokens, never raw values; when a needed token does not exist, the decision says so and the tasks establish it.
  tasks:
    - "Primitives-first ordering: the repo ships design tokens only — the prototype's primitives (.btn, .tag, .eyebrow, .card, .section-head, code-block chrome, reading-progress bar, scroll cue) are not in the codebase yet. A slice that uses a primitive MUST establish it in an earlier task; never reference a primitive the codebase does not define."
    - "Name the interactivity tier in any task that adds or changes interactive UI: Preact island (client:*), a bundled Astro <script> importing a .ts module, or BaseLayout's pre-paint init. State it once in the task that creates the component, then refer to the component by name, because two tasks naming different tiers for one component send the implementer down the wrong path — the theme toggle shipped as an island, then became a script to remove a post-hydration icon flash."
    - Keep the template's seeded Verify group last — renumber it to follow the work groups; do not drop or weaken its items. When a change touches no views, mark the view-dependent items N/A with a short note rather than deleting them; the gate steps always run.
    - Nested checkboxes count toward tracked progress; nest a sub-task only when it is genuinely separate work rather than a note on its parent.

# Per-operation guidance (OpenSpec 1.7+) — appended to the composed instructions for the apply and
# archive operations only, so it reaches `/opsx:apply` and `/opsx:archive` without bloating every
# artifact's context. Read it back with `openspec instructions apply|archive --change <name>`.
operations:
  apply:
    guidance:
      - Work on the change's own `<type>/<change-name>` branch. Never push — pushing is a human-only gate.
      - Stop at the Verify group. Run neither the snapshot suite nor the gate yourself; hand Verify to the frontend-qa-engineer agent (testing-visual-regression) and the running-preflight-checks skill.
      - Leave the manual-preview checkbox for the human at the review gate, even when the automated Verify items pass.
      - Establish a design-system primitive before any task uses it — the repo ships tokens, not primitives.
  archive:
    guidance:
      - Archive on the change's branch, before opening the pull request, so the PR carries the code and the updated spec together.
      - A MODIFIED requirement must carry the full requirement block, every scenario included; a dropped scenario now fails `openspec validate`, not just archive.
      # Quoted: the inner "key: value" would otherwise parse as a YAML map and the whole
      # guidance list would be dropped with a warning.
      - "Archiving a change whose REMOVED entries take a capability's last requirement needs `retire_capabilities: true` in that change's `.openspec.yaml`. The spec deletion is recoverable only from git."
      - Run `npm run specs:check` after archiving — CI gates on the same command.
