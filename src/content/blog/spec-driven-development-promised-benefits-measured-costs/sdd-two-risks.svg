aolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="start" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">lower token spend at execution</text></g><g transform="translate(781.7125643011758 109.5) rotate(0 60.5 13.75)"><text x="121" y="19.381999999999998" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="22px" fill="#1e1e1e" text-anchor="end" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Agent risk</text></g><g transform="translate(526.5125643011758 144.5) rotate(0 188.09999999999997 33.75)"><text x="376.2" y="15.858" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="18px" fill="#1e1e1e" text-anchor="end" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Low appetite for the risk that the</text><text x="376.2" y="38.358000000000004" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="18px" fill="#1e1e1e" text-anchor="end" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">agent gets it wrong: off-track output,</text><text x="376.2" y="60.858000000000004" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="18px" fill="#1e1e1e" text-anchor="end" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">hallucinated code, a failed audit</text></g><g transform="translate(506.7125643011758 234.5) rotate(0 198 20)"><text x="396" y="14.096" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="end" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">Counterweight: most misalignment episodes</text><text x="396" y="34.096000000000004" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji" font-size="16px" fill="#1e1e1e" text-anchor="end" style="white-space: pre;" direction="ltr" dominant-baseline="alphabetic">cost effort and trust, not irreversible damage</text></g></svg>