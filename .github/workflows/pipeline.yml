name: Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BROKENROBOT_PORT: 8080

jobs:
  verify:
    name: 'Verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint check
        run: npm run lint:check

      - name: Type check
        run: npm run type:check

      - name: OpenSpec validate
        run: npm run specs:check

      - name: DESIGN lint
        run: npm run designmd:check

      - name: DESIGN token drift check
        run: npm run tokens:check

      - name: Set up TerraForm
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.15.8'

      # TODO: fix the verification
      - name: Go to infra/cloudflare
        run: cd infra/cloudflare

      - name: TerraForm format check
        run: terraform fmt -check -recursive

      - name: TerraForm init
        run: terraform init -backend=false

      - name: TerraForm validate
        run: terraform validate -no-color

  build:
    name: 'Build'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Third-party resource check
        run: npm run thirdparty:check

      - name: Upload dist
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/
          retention-days: 3

  test:
    name: 'Test'
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run install:playwright

      - name: E2E test check
        run: node_modules/.bin/playwright test

      - name: Upload e2e test reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-test-reports
          path: reports/tests/e2e/
          retention-days: 3

  deploy-to-cloudflare:
    name: 'Deploy to Cloudflare'
    runs-on: ubuntu-24.04
    needs: [verify, build, test]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    environment: Cloudflare
    concurrency:
      group: Cloudflare
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --branch=main

      - name: Purge the Cloudflare cache
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache"
