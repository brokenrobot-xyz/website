name: Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  BROKENROBOT_PORT: 8080

jobs:
  verify-site:
    name: 'Verify site'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint check
        run: npm run lint:check

      - name: Type check
        run: npm run type:check

      - name: OpenSpec validate
        run: npm run specs:check

      - name: DESIGN lint
        run: npm run designmd:check

      - name: DESIGN token drift check
        run: npm run tokens:check

  verify-terraform:
    name: 'Verify Terraform'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    # Every step in this job is Terraform, so the directory belongs to the job
    # rather than to each step. A `cd` in a `run:` would not carry — each step
    # starts its own shell.
    defaults:
      run:
        working-directory: infra/cloudflare

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up TerraForm
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.8'

      - name: TerraForm format check
        run: terraform fmt -check -recursive

      - name: TerraForm init
        run: terraform init -backend=false

      - name: TerraForm validate
        run: terraform validate -no-color

  build-site:
    name: 'Build site'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Third-party resource check
        run: npm run thirdparty:check

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

  test-site:
    name: 'Test site'
    runs-on: ubuntu-24.04
    needs: build-site
    timeout-minutes: 10

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npm run install:playwright

      - name: E2E test check
        run: node_modules/.bin/playwright test

      - name: Upload e2e test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-test-reports
          path: reports/tests/e2e/
          retention-days: 3
